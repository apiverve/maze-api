[project]
name = "apiverve-mazegenerator"
version = "1.2.2"
authors = [
  { name="APIVerve", email="hello@apiverve.com" },
]
description = "Maze Generator creates random mazes using recursive backtracking algorithm with customizable size and difficulty."
keywords = ["maze", "labyrinth", "puzzle generator", "printable maze", "pathfinding"]
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
    "requests>=2.25.0"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Natural Language :: English",
]

[project.urls]
Homepage = "https://apiverve.com/marketplace/maze?utm_source=pypi&utm_medium=referral&utm_content=homepage"
Documentation = "https://docs.apiverve.com/ref/maze?utm_source=pypi&utm_medium=referral&utm_content=docs"
Repository = "https://github.com/apiverve/maze-api"
Twitter = "https://twitter.com/apivervehq"
